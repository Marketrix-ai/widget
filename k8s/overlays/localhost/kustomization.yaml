apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: marketrix
resources:
  - ../../base
patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: widget
      spec:
        template:
          spec:
            containers:
              - name: widget
                resources:
                  requests:
                    memory: 512Mi
                  limits:
                    memory: 1Gi
                livenessProbe:
                  httpGet:
                    path: /
                  initialDelaySeconds: 30
                  periodSeconds: 30
                readinessProbe:
                  httpGet:
                    path: /
                startupProbe:
                  httpGet:
                    path: /
                  failureThreshold: 24
                  periodSeconds: 5
