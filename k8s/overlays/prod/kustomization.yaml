apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
images:
  - name: marketrix/widget
    newName: marketrix.azurecr.io/prod/widget
    newTag: latest
patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: widget
      spec:
        template:
          spec:
            containers:
              - name: widget
                imagePullPolicy: Always
                resources:
                  requests:
                    cpu: 200m
                    memory: 256Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
