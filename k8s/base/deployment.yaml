apiVersion: apps/v1
kind: Deployment
metadata:
  name: widget
  labels:
    app: widget
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: widget
  template:
    metadata:
      labels:
        app: widget
    spec:
      containers:
        - name: widget
          image: marketrix/widget:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: widget-config
                optional: true
            - secretRef:
                name: widget-env
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 5
      terminationGracePeriodSeconds: 10
