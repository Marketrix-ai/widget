# Git hooks: pre-commit formats and lint-fixes the staged files, because a pre-push hook cannot change what git has
# already resolved to push; pre-push runs `code:check` and the tests. Prettier exits 2 on the AGENTS.md symlink.
# `rc` restores bun onto PATH for GUI git clients; re-run `lefthook install` after changing it.
rc: ./.lefthookrc

pre-commit:
  parallel: false
  commands:
    format:
      glob: '*.{ts,tsx,js,mjs,cjs,json,md,yml,yaml,css}'
      exclude: [AGENTS.md]
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{ts,tsx,js,mjs,cjs}'
      run: bunx eslint --fix --no-warn-ignored --max-warnings 0 {staged_files}
      stage_fixed: true

pre-push:
  parallel: false
  commands:
    code-check:
      run: bun run code:check
    test:
      run: bun run test
