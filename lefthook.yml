# https://github.com/evilmartians/lefthook

# Restores node/npm onto PATH before any command runs — GUI git clients start hooks with a minimal
# environment. Changing this line requires re-running `lefthook install`: the path is baked into the
# generated hook shims, not read at run time.
rc: .lefthookrc

pre-commit:
  commands:
    check:
      run: npm run check
    lint:
      run: npm run lint
      stage_fixed: true
