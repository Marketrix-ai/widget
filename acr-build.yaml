# Cloud build straight to ACR, bypassing GitHub Actions entirely.
#   az acr run --registry marketrix --file acr-build.yaml \
#     --set tag=<version> --set commit=$(git rev-parse HEAD) .
# Mirrors infra's ci-service.yml build step, with one difference that matters: DOCKER_BUILDKIT=1.
# ACR's classic builder has BuildKit OFF, and this Dockerfile uses `RUN --mount=type=cache`, which
# fails there with "the --mount option requires BuildKit" — so `az acr build` cannot build this repo.
version: v1.1.0
steps:
  - build: -t marketrix.azurecr.io/widget:{{.Values.tag}} --build-arg BUILD_COMMIT={{.Values.commit}} -f Dockerfile .
    env:
      - DOCKER_BUILDKIT=1
  - push:
      - marketrix.azurecr.io/widget:{{.Values.tag}}
