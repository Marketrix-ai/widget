# Brotli beats gzip by ~17 kB on the bundle but nginx:alpine carries no brotli module, so the
# precompressed sibling is selected by hand. `q=0` is an explicit refusal, not an offer. Every
# `add_header` below carries `always`: without it nginx applies `add_header` only to 2xx/3xx, so a
# customer host's cross-origin fetch of a stale/typo'd widget path would see a CORS-blocked 404 that
# reads as a network error in the browser console rather than the plain 404 it actually is — asserted
# by `scripts/checkServed.ts`, which derives its expected header values from this file rather than a
# second hardcoded table.
map $http_accept_encoding $mtx_brotli_suffix {
    default                  "";
    "~*\bbr\b(?!\s*;\s*q=0)" ".br";
}

map $mtx_brotli_suffix $mtx_content_encoding {
    default "";
    ".br"   "br";
}

server {
    listen 9001;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;

    # Every compressible asset ships with a .gz/.br sibling built in the image, so nothing is
    # compressed per request. loader.js is 894 bytes and not worth either.
    gzip_static on;

    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    location = /widget.mjs {
        try_files /widget.mjs$mtx_brotli_suffix /widget.mjs =404;
        # try_files lands on widget.mjs.br, whose extension would otherwise decide the type.
        types { }
        default_type application/javascript;
        # nginx drops an add_header whose value resolves empty, so identity responses carry none.
        add_header Content-Encoding $mtx_content_encoding always;
        add_header Vary Accept-Encoding always;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
    }
}
