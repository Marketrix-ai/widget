# Serves the widget bundle and loader from precompressed siblings built into the image; nothing is
# compressed per request. nginx:alpine has no brotli module, so the `.br` sibling is picked by hand from
# Accept-Encoding, where `q=0` is a refusal. `types { }` keeps the `.br` extension from setting the type,
# and nginx drops an empty `add_header`, so identity responses carry no Content-Encoding. Every
# `add_header` carries `always`, so a customer's cross-origin fetch of a bad path sees a plain 404, not a
# CORS error. `scripts/checkServed.ts` derives its expected headers from this file.
map $http_accept_encoding $mtx_brotli_suffix {
    default                  "";
    "~*\bbr\b(?!\s*;\s*q=0)" ".br";
}

map $mtx_brotli_suffix $mtx_content_encoding {
    default "";
    ".br"   "br";
}

server {
    listen 9001;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;

    gzip_static on;

    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    location = /widget.mjs {
        try_files /widget.mjs$mtx_brotli_suffix /widget.mjs =404;
        types { }
        default_type application/javascript;
        add_header Content-Encoding $mtx_content_encoding always;
        add_header Vary Accept-Encoding always;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
    }
}
