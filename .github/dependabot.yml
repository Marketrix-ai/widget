# Weekly dependency updates against `main` for npm, docker and github-actions. npm minor and patch bumps
# are grouped into one pull request, capped at five open at a time, so a lockfile change arrives as a
# single reviewable diff rather than a flood.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 5
    target-branch: 'main'
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'main'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'main'
