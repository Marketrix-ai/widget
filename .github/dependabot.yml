version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 5
    target-branch: 'dev'
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'dev'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'dev'
    # Shared CI is the PRIVATE Marketrix-ai/infra reusable workflow, pinned to a
    # branch (@dev) Dependabot can't reach or version-bump; ignore it so the
    # weekly run still updates the repo-local actions (checkout / setup-node).
    ignore:
      - dependency-name: 'Marketrix-ai/infra/*'
