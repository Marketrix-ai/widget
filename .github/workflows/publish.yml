# Publishes the package to npm on a `v*` tag, independently of the image build, authenticating with the
# classic `NPM_TOKEN` secret. `--tolerate-republish` exits 0 when the version is already on the registry,
# so a green run does not prove a new publish — check `npm view @marketrix.ai/widget version` before
# pinning `app`'s lockfile to it.
name: Publish
on:
  push:
    tags: ['v*']
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Publish to npm
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish --access public --tolerate-republish
