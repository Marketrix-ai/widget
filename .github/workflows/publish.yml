# Publishes the package to npm on a `v*` tag, independently of the image build. The publish step is
# idempotent by design: an `npm view` hit exits 0, so a green run does NOT prove a publish happened —
# check `npm view @marketrix.ai/widget version` before pinning `app`'s lockfile to a version.
name: Publish
on:
  push:
    tags: ['v*']
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "Already on registry: $NAME@$VER — skipping publish"
            exit 0
          fi
          npm publish --access public
