# Publishes the package to npm on a `v*` tag, independently of the image build. Auth is a classic npm
# token (`secrets.NPM_TOKEN`), not OIDC/provenance, so `bun publish` reads it via `NPM_CONFIG_TOKEN` —
# no `actions/setup-node`/registry-url dance needed. `--tolerate-republish` replaces the old manual
# `npm view` idempotency check with bun's own equivalent: exit 0 (not a failed re-run) when the version
# is already on the registry, so a green run still does NOT prove a NEW publish happened — check
# `npm view @marketrix.ai/widget version` before pinning `app`'s lockfile to a version.
name: Publish
on:
  push:
    tags: ['v*']
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Publish to npm
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish --access public --tolerate-republish
