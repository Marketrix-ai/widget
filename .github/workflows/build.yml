name: Build

on:
  push:
    tags: ['v*']
    branches: [dev]

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RAW="${GITHUB_REF#refs/tags/}"
            echo "image_tag=${RAW#v}" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "image_tag=dev-${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        if: steps.tag.outputs.is_tag == 'true'
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        if: steps.tag.outputs.is_tag == 'true'
        run: |
          npm ci
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image
        run: |
          az acr login --name marketrix
          TAG="${{ steps.tag.outputs.image_tag }}"
          IMG="marketrix.azurecr.io/widget:${TAG}"
          docker build -t "$IMG" -f Dockerfile .
          docker push "$IMG"

      - name: Cleanup
        if: always()
        run: docker image prune -af && docker builder prune -f || true
