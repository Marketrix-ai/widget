name: Deploy WIDGET-DEV
on:
  push:
    branches: [dev]
jobs:
  build-and-deploy:
    runs-on: prod-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload to Azure Storage
        run: |
          az storage blob delete-batch --source widget --pattern "dev/*" --account-name marketrix --auth-mode login
          az storage blob upload-batch --destination widget/dev --source ./dist --account-name marketrix --overwrite --auth-mode login
      - name: Cleanup
        run: rm -rf ./dist
