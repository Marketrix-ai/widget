name: Deploy WIDGET-DEV
on:
  push:
    branches:
      - dev
jobs:
  build-and-deploy:
    runs-on: prod-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Install dependencies
        run: npm ci
      - name: Build the project
        run: npm run build:dev
      - name: Upload to Azure Storage
        run: |
          # Delete existing dev files using a more robust approach
          az storage blob list --container-name widget --prefix "dev/" --account-name marketrix --auth-mode login --query "[].name" -o tsv | while read blob; do
            if [[ "$blob" == dev/* ]]; then
              az storage blob delete --container-name widget --name "$blob" --account-name marketrix --auth-mode login
            fi
          done
          az storage blob upload-batch --destination widget/dev --source ./dist/dev --account-name marketrix --overwrite --auth-mode login
      - name: Clean up build artifacts
        run: rm -rf ./dist
