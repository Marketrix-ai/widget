name: Preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: ${{ contains(github.event.pull_request.labels.*.name, 'preview:prod') && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v6

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push Image
        run: |
          az acr login --name marketrix
          PR="${{ github.event.pull_request.number }}"
          IMG="marketrix.azurecr.io/pr/widget:pr-${PR}"
          docker build -t $IMG -f Dockerfile .
          docker push $IMG

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group Marketrix \
            --name marketrix-aks \
            --overwrite-existing

      - name: Create PR namespace
        run: |
          NS="pr-${{ github.event.pull_request.number }}"
          kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to PR namespace
        run: |
          NS="pr-${{ github.event.pull_request.number }}"
          cd k8s/overlays/dev
          kustomize build . \
            | sed "s|namespace: dev|namespace: $NS|g" \
            | sed "s|marketrix.azurecr.io/dev/widget:latest|marketrix.azurecr.io/pr/widget:pr-${{ github.event.pull_request.number }}|g" \
            | kubectl apply -f -
          kubectl rollout status deployment/widget --namespace "$NS" --timeout=300s

      - name: Create PR ingress
        run: |
          PR="${{ github.event.pull_request.number }}"
          NS="pr-${PR}"
          cat <<EOF | kubectl apply -f -
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: pr-ingress-widget
            namespace: $NS
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
          spec:
            ingressClassName: nginx
            tls:
              - hosts:
                  - pr-${PR}-widget.marketrix.co
                secretName: pr-${PR}-widget-tls
            rules:
              - host: pr-${PR}-widget.marketrix.co
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: widget
                          port:
                            number: 80
          EOF

      - name: Create DNS record
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          INGRESS_IP=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          curl -sf -X POST \
            -H "Authorization: Bearer $DO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"A\",\"name\":\"pr-${PR}-widget\",\"data\":\"$INGRESS_IP\",\"ttl\":300}" \
            "https://api.digitalocean.com/v2/domains/marketrix.co/records"

      - name: Cleanup
        if: always()
        run: docker image prune -af && docker builder prune -f || true

  comment:
    needs: deploy
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const body = `**Preview deployed**: https://pr-${pr}-widget.marketrix.co`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            });
            const existing = comments.find(c => c.body.includes('Preview deployed'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            }

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group Marketrix \
            --name marketrix-aks \
            --overwrite-existing

      - name: Delete PR resources
        run: |
          NS="pr-${{ github.event.pull_request.number }}"
          kubectl delete deployment widget --namespace "$NS" --ignore-not-found
          kubectl delete service widget --namespace "$NS" --ignore-not-found
          kubectl delete ingress pr-ingress-widget --namespace "$NS" --ignore-not-found

      - name: Delete DNS record
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          RECORD_ID=$(curl -sf -H "Authorization: Bearer $DO_TOKEN" \
            "https://api.digitalocean.com/v2/domains/marketrix.co/records?per_page=200" \
            | jq -r ".domain_records[] | select(.name == \"pr-${PR}-widget\") | .id")
          if [ -n "$RECORD_ID" ] && [ "$RECORD_ID" != "null" ]; then
            curl -sf -X DELETE \
              -H "Authorization: Bearer $DO_TOKEN" \
              "https://api.digitalocean.com/v2/domains/marketrix.co/records/${RECORD_ID}"
          fi
