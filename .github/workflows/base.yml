name: Widget Base Workflow

on:
  workflow_call:
    inputs:
      action:
        description: 'Action to perform (build|deploy)'
        required: true
        type: string
      environment:
        description: 'Target environment (dev|prod)'
        required: true
        type: string
      version:
        description: 'Git tag for prod deploys (e.g. v1.2.0)'
        required: false
        type: string
        default: ''

jobs:
  # ── BUILD (sanity check only) ─────────────────────────
  build:
    if: inputs.action == 'build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Cleanup
        if: always()
        run: rm -rf ./dist

  # ── DEPLOY (build + upload + purge) ────────────────────
  deploy:
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Validate prod requires version
        if: inputs.environment == 'prod' && inputs.version == ''
        run: |
          echo "::error::Production deploys require a version tag"
          exit 1

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version || 'dev' }}

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload to Azure Storage
        run: |
          FOLDER=${{ inputs.environment == 'prod' && 'latest' || 'dev' }}
          az storage blob delete-batch --source widget --pattern "$FOLDER/*" --account-name marketrix --auth-mode login
          az storage blob upload-batch --destination widget/$FOLDER --source ./dist --account-name marketrix --overwrite --auth-mode login

      - name: Purge CDN cache
        run: |
          FOLDER=${{ inputs.environment == 'prod' && 'latest' || 'dev' }}
          az afd endpoint purge --profile-name marketrix --endpoint-name marketrix-cdn --resource-group Marketrix --content-paths "/widget/$FOLDER/*" --no-wait

      - name: Cleanup
        if: always()
        run: rm -rf ./dist
