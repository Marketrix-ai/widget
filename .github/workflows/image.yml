# Builds and pushes the runtime image on a `v*` tag, natively on an arm64 runner, the public-repo twin of infra's
# `image-build` action. Images are arm64 because the one cluster node is Arm and an emulated arm64 build hangs Bun.
# The image tag is the BARE semver — the leading `v` is stripped — which is what infra's Helm values pin. The Trivy
# scan reports and never blocks.
name: Image
on:
  push:
    tags: ['v*']
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Resolve image tag
        id: tag
        run: |
          RAW="${GITHUB_REF#refs/tags/}"
          echo "image_tag=${RAW#v}" >> "$GITHUB_OUTPUT"
      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Log in to ACR
        run: az acr login --name marketrix
      - uses: docker/setup-buildx-action@v4
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: marketrix.azurecr.io/widget:${{ steps.tag.outputs.image_tag }}
          build-args: BUILD_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.image_tag }}
          cache-from: type=gha,scope=widget
          cache-to: type=gha,mode=max,scope=widget
          provenance: false
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: marketrix.azurecr.io/widget:${{ steps.tag.outputs.image_tag }}
          format: table
          severity: CRITICAL,HIGH
        continue-on-error: true
