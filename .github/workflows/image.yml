# Builds and pushes the runtime image on a `v*` tag, natively on an arm64 runner, the public-repo twin of infra's
# `image-build` action. Images are arm64 because the one cluster node is Arm and an emulated arm64 build hangs Bun.
# The image tag is the BARE semver — the leading `v` is stripped — which is what infra's Helm values pin. It logs in
# to Azure over OIDC from the `image` environment, the subject the service principal trusts. It does not scan: infra's
# `image-scan.yml` scans every deployed image daily.
name: Image
on:
  push:
    tags: ['v*']
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    environment: image
    permissions: { contents: read, id-token: write }
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Resolve image tag
        id: tag
        run: |
          RAW="${GITHUB_REF#refs/tags/}"
          echo "image_tag=${RAW#v}" >> "$GITHUB_OUTPUT"
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: bb547db7-2849-4c43-9f43-48c4f3cf8cb2
          tenant-id: 987c031c-364b-4944-95da-43314e1986cf
          subscription-id: 793584b8-3b67-4dc2-aabb-77d08417ce88
      - name: Log in to ACR
        run: az acr login --name marketrix
      - uses: docker/setup-buildx-action@v4
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: marketrix.azurecr.io/widget:${{ steps.tag.outputs.image_tag }}
          build-args: BUILD_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.image_tag }}
          provenance: false
