name: Deploy WIDGET
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - prod
      version:
        description: "Git tag for prod deploys (e.g. v1.2.0)"
        required: false
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/base.yml
    with:
      action: deploy
      environment: ${{ inputs.environment }}
      version: ${{ inputs.version }}
    secrets: inherit
