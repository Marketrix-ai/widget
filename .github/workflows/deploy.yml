name: Deploy
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (existing deploys that version, new creates on current commit)'
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: write
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        run: |
          TAG="${{ inputs.tag }}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag '$TAG' exists, deploying that version"
            COMMIT=$(git rev-list -n1 "refs/tags/$TAG")
            git checkout "$TAG"
            echo "created=false" >> $GITHUB_OUTPUT
          else
            echo "Tag '$TAG' is new, will create on current commit"
            COMMIT=$(git rev-parse HEAD)
            echo "created=true" >> $GITHUB_OUTPUT
          fi
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Build
        run: npm run build

      - name: Publish to npm
        if: inputs.environment == 'prod'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create tag
        if: steps.resolve.outputs.created == 'true'
        run: |
          git tag "${{ inputs.tag }}"
          git push origin "${{ inputs.tag }}"

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image
        run: |
          az acr login --name marketrix
          ENV="${{ inputs.environment }}"
          VER="${{ steps.resolve.outputs.version }}"
          IMG="marketrix.azurecr.io/${ENV}/widget:${VER}"
          LATEST="marketrix.azurecr.io/${ENV}/widget:latest"
          docker build -t "$IMG" -f Dockerfile --build-arg BUILD_COMMIT=${{ github.sha }} .
          docker push "$IMG"
          docker tag "$IMG" "$LATEST"
          docker push "$LATEST"

      - name: Deploy to AKS
        run: |
          az aks get-credentials \
            --resource-group Marketrix \
            --name marketrix-aks \
            --overwrite-existing
          ENV="${{ inputs.environment }}"
          VER="${{ steps.resolve.outputs.version }}"
          cd k8s/overlays/$ENV
          kustomize edit set image "marketrix/widget=marketrix.azurecr.io/${ENV}/widget:${VER}"
          kustomize build . | kubectl apply -f -
          git checkout -- kustomization.yaml
          kubectl rollout status deployment/widget --namespace "$ENV" --timeout=300s

      - name: Cleanup
        if: always()
        run: docker image prune -af && docker builder prune -f || true
