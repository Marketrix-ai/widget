name: Deploy
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (existing deploys that version, new creates on current commit)'
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: write
  actions: read

jobs:
  publish-npm:
    if: inputs.environment == 'prod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy:
    needs: [publish-npm]
    if: always() && (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped')
    uses: Marketrix-ai/marketrix-infra/.github/workflows/deploy-service.yml@main
    with:
      tag: ${{ inputs.tag }}
      environment: ${{ inputs.environment }}
      service: widget
      validate_cmd: 'npm ci && npm run type-check && npm run build'
      build_args: '--build-arg BUILD_COMMIT=${{ github.sha }}'
    secrets: inherit
