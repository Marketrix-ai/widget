name: Deploy WIDGET-PROD
on:
  release:
    types: [created]
jobs:
  build-and-deploy:
    runs-on: prod-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Version
        id: version
        run: tag="${{ github.event.release.tag_name }}" && echo "version=${tag#v}" >> $GITHUB_OUTPUT
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload to Azure Storage
        run: |
          az storage blob delete-batch --source widget --pattern "latest/*" --account-name marketrix --auth-mode login
          az storage blob upload-batch --destination widget/latest --source ./dist --account-name marketrix --overwrite --auth-mode login
      - name: Cleanup
        run: rm -rf ./dist
