name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ startsWith(github.ref, 'refs/tags/') && github.sha || github.ref }}
  cancel-in-progress: true
# This public repository cannot call reusable workflows from the private infra repository.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - run: npm run ci
