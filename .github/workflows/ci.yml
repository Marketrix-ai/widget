name: CI
on:
  push:
    branches: [dev]
    tags: ['v*']
  pull_request:
    branches: [dev]
concurrency:
  group: ci-${{ startsWith(github.ref, 'refs/tags/') && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint 2>/dev/null || echo "No lint script"
      - name: Build
        run: npm run build
      - name: Format check
        run: npm run format:check
      - name: Tests
        run: npm run test:run
      - name: Visual check
        run: npm run visual:check
      - name: Accessibility check
        run: npm run a11y:check
      - name: Bundle check
        run: npm run bundle:check

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve image tag
        id: tag
        run: |
          RAW="${GITHUB_REF#refs/tags/}"
          echo "image_tag=${RAW#v}" >> $GITHUB_OUTPUT
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Log in to ACR
        run: az acr login --name marketrix
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: marketrix.azurecr.io/widget:${{ steps.tag.outputs.image_tag }}
          build-args: BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      # Sync-tagging an unchanged widget doesn't bump package.json, so the
      # version we'd publish is already on the registry. Skip in that case
      # rather than fail the run with "cannot publish over previously
      # published versions". Mirrors infra/.github/workflows/ci-service.yml.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "Already on registry: $NAME@$VER — skipping publish"
            exit 0
          fi
          npm publish --access public
