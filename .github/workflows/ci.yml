# Repository-local CI: bun, `bun install --frozen-lockfile`, then on a pull request `bun run ci`, the whole
# validation gate, and on a push to `main` only `bun run build`, which is all the deploy gate reads. Markdown-only
# changes skip it, a pull request through the `changes` job so the required `ci` check still reports. This public
# repository cannot call the private infra repository's reusable workflows, so infra's Node gate is mirrored here.
name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != pull_request ] || ! git diff --quiet HEAD^1 HEAD -- ':!*.md'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - run: bun run ${{ github.event_name == 'pull_request' && 'ci' || 'build' }}
