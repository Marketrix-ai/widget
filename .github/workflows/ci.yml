# Repository-local CI for pull requests and pushes to `main`: Node 26, `npm ci`, then `npm run ci`, which
# is the whole validation gate. This public repository cannot call the private infra repository's reusable
# workflows, so the gate is duplicated here rather than shared.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ startsWith(github.ref, 'refs/tags/') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - run: npm run ci
