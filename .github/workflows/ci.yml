# Repository-local CI: bun, `bun install --frozen-lockfile`, then on a pull request `bun run ci`, the whole
# validation gate, and on a push to `main` only `bun run build`, which is all the deploy gate reads. Markdown-only
# changes skip it. This public repository cannot call the private infra repository's reusable workflows, so infra's
# Node gate is mirrored here.
name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - run: bun run ${{ github.event_name == 'pull_request' && 'ci' || 'build' }}
