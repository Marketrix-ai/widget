name: CI
on:
  push:
    branches: [dev]
    tags: ['v*']
  pull_request:
    branches: [dev]
concurrency:
  group: ci-${{ startsWith(github.ref, 'refs/tags/') && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: Marketrix-ai/infra/.github/workflows/ci-service.yml@dev
    with:
      service: widget
    secrets: inherit
