<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketrix Widget dev page</title>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var script = document.createElement('script');
        script.src = './loader.js';
        script.setAttribute('mtx-id', params.get('mtx-id') || '');
        script.setAttribute('mtx-key', params.get('mtx-key') || '');
        script.setAttribute('mtx-api-host', params.get('mtx-api-host') || 'http://api.marketrix.localhost');
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>Marketrix Widget dev page</h1>
      <p>Pass <code>?mtx-id=…&amp;mtx-key=…&amp;mtx-api-host=…</code> to load the widget from this server.</p>
    </main>
  </body>
</html>
