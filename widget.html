<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketrix Widget</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <!-- Widget Script - Parameters injected from URL -->
    <script type="module" src="./meet.js" id="marketrix-widget-script"></script>

    <script>
      // Read URL parameters and inject them into the script tag
      (function () {
        const urlParams = new URLSearchParams(window.location.search);
        const script = document.getElementById('marketrix-widget-script');

        // Get parameters from URL
        const mtxId = urlParams.get('mtx-id');
        const mtxKey = urlParams.get('mtx-key');
        const mtxApp = urlParams.get('mtx-app');
        const mtxAgent = urlParams.get('mtx-agent');
        const mtxApiHost = urlParams.get('mtx-api-host');
        const mtxAiHost = urlParams.get('mtx-ai-host');

        console.log('📋 Widget HTML - URL Parameters:', {
          mtxId,
          mtxKey: mtxKey ? '***' : null,
          mtxApp,
          mtxAgent,
          mtxApiHost,
          mtxAiHost,
        });

        // Set attributes on script tag
        if (mtxId) {
          script.setAttribute('mtx-id', mtxId);
        }
        if (mtxKey) {
          script.setAttribute('mtx-key', mtxKey);
        }
        if (mtxApp) {
          script.setAttribute('mtx-app', mtxApp);
        }
        if (mtxAgent) {
          script.setAttribute('mtx-agent', mtxAgent);
        }
        if (mtxApiHost) {
          script.setAttribute('mtx-api-host', mtxApiHost);
        }
        if (mtxAiHost) {
          script.setAttribute('mtx-ai-host', mtxAiHost);
        }

        console.log('✅ Widget script attributes set:', {
          'mtx-id': script.getAttribute('mtx-id'),
          'mtx-key': script.getAttribute('mtx-key') ? '***' : null,
          'mtx-app': script.getAttribute('mtx-app'),
          'mtx-agent': script.getAttribute('mtx-agent'),
          'mtx-api-host': script.getAttribute('mtx-api-host'),
          'mtx-ai-host': script.getAttribute('mtx-ai-host'),
        });
      })();
    </script>
  </body>
</html>
